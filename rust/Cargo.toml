[workspace]
resolver = "2"
members = ["songspec-core", "songspec-cli", "songspec-app"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/songspec/songspec-analyzer"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

# the DSP and tract are far too slow unoptimised for real songs; tests on real audio run in release
[profile.dev.package."*"]
opt-level = 2

# quick optimised builds while developing (no LTO, parallel codegen); release stays the shipping profile
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
