[package]
name = "songspec-app"
description = "SongSpec Analyzer desktop app (egui)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "SongSpecAnalyzer"
path = "src/main.rs"

[dependencies]
songspec-core = { path = "../songspec-core" }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.18.0"
rodio = "0.23.0"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
png = "0.18.1"
